- id: '1739623126099'
  alias: Auto - Maison - Poubelles - Rappel ordures ménagères
  description: ''
  use_blueprint:
    path: Blackshome/calendar-notifications-and-actions.yaml
    input:
      calendar: calendar.ordures_menageres
      start_notify_device:
      - 1cad52a98187142ef5ef9677c443af35
      start_notify_data:
      - high_priority
      - sticky
      start_calendar_offset:
        hours: -13
        minutes: 0
        seconds: 0
        days: 0
      include_calendar_trigger: disable_key_word
      include_start_notify: enable_start_notify_options
      include_start_action_buttons:
      - enable_start_action_button_1
      start_action_button_1: Sortir
      start_action_button_confirmation_title: Ordures ménagères
      start_action_button_confirmation_message: La poubelle d'ordures ménagères a
        été sortie
