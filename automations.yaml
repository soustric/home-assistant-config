- id: '1751835837105'
  alias: Sécurité - Maison - Eufy - Mode Nuit à 22h
  description: Déclenche le mode Nuit de l'alarme Eufy tous les jours à 22h
  triggers:
  - at: '22:00:00'
    trigger: time
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: select.homebase_3_guard_mode
      state: Custom 1
  actions:
  - target:
      entity_id: alarm_control_panel.homebase_3
    action: alarm_control_panel.alarm_arm_custom_bypass
    data: {}
  mode: single
- id: '1753120892176'
